[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jev-digest"
version = "0.1.0"
description = "Purpose-driven passage digest for agents: search, fetch, judge every passage with TypeSafe's Jev, return only what answers the question, grouped by aspect, with sources attached. No generation."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "protag" }]
keywords = ["search", "agents", "mcp", "jev", "typesafe", "searxng", "rag"]
dependencies = [
  "httpx>=0.27",
  "curl_cffi>=0.7",
  "trafilatura>=1.9",
  "lxml>=5",
  "tiktoken>=0.7",
  "ddgs>=9",
  "python-dotenv>=1.0",
  "pypdf>=4",
]

[project.optional-dependencies]
browser = ["playwright>=1.45"]
mcp = ["mcp>=1.0,<2"]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
jev-digest = "jev_digest.cli:main"
jev-digest-mcp = "jev_digest.mcp_server:main"

[tool.setuptools.packages.find]
include = ["jev_digest*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
